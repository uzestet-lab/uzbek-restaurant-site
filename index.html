<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzbek Restaurant</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
  text-align:center;
}

/* АНИМАЦИЯ */
@keyframes dropFade{
  from{opacity:0; transform:translateY(-18px);}
  to{opacity:1; transform:translateY(0);}
}

.block{
  opacity:0;
  animation:dropFade 1s ease forwards;
}

/* ЗАДЕРЖКИ */
.logo{animation-delay:.2s;}
.title{animation-delay:.6s;}
.text{animation-delay:1.2s;}
.btn1{animation-delay:1.8s;}
.btn2{animation-delay:2.1s;}
.btn3{animation-delay:2.4s;}
.btn4{animation-delay:2.7s;}
.btn5{animation-delay:3s;}

/* КНОПКИ */
.btn{
  display:block;
  width:80%;
  margin:10px auto;
  padding:14px;
  background:#222;
  border-radius:10px;
  text-decoration:none;
  color:#fff;
  font-size:16px;

  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s ease;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn:active{
  transform:scale(0.97);
}

/* ВЫДЕЛЕНИЕ МЕНЮ */
.menu{
  background:linear-gradient(135deg,#d4af37,#f5d76e);
  color:#000;
  font-weight:bold;
}
</style>
</head>

<body>

<h1 class="block logo">Uzbek Restaurant</h1>
<h2 class="block title">Authentic Uzbek Cuisine</h2>

<p class="block text" id="text">
Welcome to our restaurant. Enjoy real taste of Uzbekistan.
</p>

<a href="menu.pdf" class="btn block btn1 menu">Menu</a>
<a href="https://instagram.com/" class="btn block btn2">Instagram</a>
<a href="https://maps.google.com" class="btn block btn3">Google Maps</a>
<a href="https://r.grab.com/" class="btn block btn4">GrabFood</a>
<a href="https://wa.me/" class="btn block btn5">Contact Manager</a>

<script>
// АВТО ЯЗЫК
function setLang(lang){
  var text=document.getElementById("text");

  if(lang.includes("ru")){
    text.innerHTML="Добро пожаловать в наш ресторан. Настоящий вкус Узбекистана.";
  }
  else if(lang.includes("id")){
    text.innerHTML="Selamat datang di restoran kami. Nikmati cita rasa Uzbekistan.";
  }
  else{
    text.innerHTML="Welcome to our restaurant. Enjoy real taste of Uzbekistan.";
  }
}

var lang=(navigator.language||"en").toLowerCase();
setLang(lang);

// ВИБРО
document.querySelectorAll('.btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    if(navigator.vibrate){
      navigator.vibrate(10);
    }
  });
});
</script>

</body>
</html>
