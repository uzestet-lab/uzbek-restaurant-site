<style>
*{
-webkit-tap-highlight-color:transparent;
-webkit-touch-callout:none;
-webkit-user-select:none;
user-select:none;
}

body{
animation:pageFade 1.8s ease forwards;
opacity:0;
}

@keyframes pageFade{
from{opacity:0; transform:scale(1.01);}
to{opacity:1; transform:scale(1);}
}

.logo{
opacity:0;
transform:translateY(30px) scale(.92);
animation:logoIn 1.8s ease forwards;
animation-delay:.25s;
}

@keyframes logoIn{
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

h1{
opacity:0;
transform:translateY(24px);
animation:titleIn 1.4s ease forwards;
animation-delay:.7s;
}

@keyframes titleIn{
to{
opacity:1;
transform:translateY(0);
}
}

.line{
opacity:0;
transform:scaleX(.5);
animation:lineIn 1.2s ease forwards;
animation-delay:1s;
}

@keyframes lineIn{
to{
opacity:1;
transform:scaleX(1);
}
}

.langs{
opacity:0;
transform:translateY(16px);
animation:fadeUp 1.2s ease forwards;
animation-delay:1.15s;
}

.text{
opacity:0;
transform:translateY(22px);
animation:textIn 1.4s ease forwards;
animation-delay:1.35s;
}

@keyframes textIn{
to{
opacity:1;
transform:translateY(0);
}
}

.btn{
opacity:0;
transform:translateY(28px);
animation:btnShow .9s ease forwards;
position:relative;
overflow:hidden;
transition:.18s ease;
}

.btn:nth-of-type(1){animation-delay:1.8s;}
.btn:nth-of-type(2){animation-delay:2.0s;}
.btn:nth-of-type(3){animation-delay:2.2s;}
.btn:nth-of-type(4){animation-delay:2.4s;}

@keyframes btnShow{
to{
opacity:1;
transform:translateY(0);
}
}

.btn:before{
content:"";
position:absolute;
top:50%;
left:50%;
width:0;
height:0;
background:rgba(199,165,106,.16);
border-radius:50%;
transform:translate(-50%,-50%);
transition:.35s ease;
}

.btn:active:before{
width:320px;
height:320px;
}

.btn:active{
transform:scale(.96);
box-shadow:
0 0 25px rgba(199,165,106,.30),
0 0 40px rgba(199,165,106,.12);
border-color:#e3ca96;
background:rgba(199,165,106,.08);
}

.wifi{
opacity:0;
transform:translateY(22px);
animation:fadeUp 1.1s ease forwards;
animation-delay:2.65s;
}

.footer{
opacity:0;
animation:fadeUp 1s ease forwards;
animation-delay:2.9s;
}

@keyframes fadeUp{
to{
opacity:1;
transform:translateY(0);
}
}
</style>
