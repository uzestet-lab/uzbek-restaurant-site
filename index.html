<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UzBek Restaurant Bali</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--bg1:#08111d;
--bg2:#12233a;
--gold:#c7a56a;
--goldSoft:#e7d3a6;
--line:rgba(199,165,106,.38);
--glass:rgba(255,255,255,.035);
--white:rgba(255,255,255,.94);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
-webkit-touch-callout:none;
-webkit-user-select:none;
user-select:none;
}

body{
font-family:Inter,sans-serif;
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
padding:18px;
overflow-x:hidden;
background:
radial-gradient(circle at 15% 10%, rgba(199,165,106,.05), transparent 28%),
radial-gradient(circle at 85% 85%, rgba(199,165,106,.04), transparent 28%),
linear-gradient(135deg,var(--bg1),var(--bg2));
animation:bgMove 16s ease-in-out infinite alternate, pageIn 1.2s ease forwards;
opacity:0;
}

@keyframes bgMove{
from{background-position:0 0,100% 100%,0 0;}
to{background-position:3% 0,97% 100%,0 0;}
}

@keyframes pageIn{
from{opacity:0;}
to{opacity:1;}
}

.wrap{
width:100%;
max-width:430px;
text-align:center;
}

.logo,.title,.line,.langs,.text,.btn,.wifi,.footer{
opacity:0;
transform:translateY(16px);
animation:reveal .75s cubic-bezier(.22,1,.36,1) forwards;
}

.logo{animation-delay:.15s;}
.title{animation-delay:.30s;}
.line{animation-delay:.45s;}
.langs{animation-delay:.58s;}
.text{animation-delay:.72s;}
.btn1{animation-delay:.90s;}
.btn2{animation-delay:1.02s;}
.btn3{animation-delay:1.14s;}
.btn4{animation-delay:1.26s;}
.wifi{animation-delay:1.42s;}
.footer{animation-delay:1.58s;}

@keyframes reveal{
to{opacity:1;transform:translateY(0);}
}

.logo{
width:92px;
height:92px;
margin:8px auto 18px;
border-radius:50%;
overflow:hidden;
border:1px solid var(--line);
box-shadow:0 0 18px rgba(199,165,106,.10);
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
}

.title{
font-family:'Playfair Display',serif;
font-size:31px;
line-height:1.2;
margin-bottom:12px;
}

.line{
width:84px;
height:1px;
margin:0 auto 22px;
background:linear-gradient(90deg,transparent,var(--gold),transparent);
}

.langs{
display:flex;
justify-content:center;
gap:8px;
flex-wrap:wrap;
margin-bottom:18px;
}

.langs button{
border:1px solid var(--line);
background:transparent;
color:#fff;
padding:8px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
transition:.2s;
}

.langs button.active{
background:var(--gold);
color:#111;
}

.text{
font-size:15px;
line-height:1.9;
margin-bottom:22px;
min-height:170px;
color:var(--white);
}

.hidden{display:none;}

.btn{
display:block;
text-decoration:none;
color:#fff;
padding:15px 16px;
margin-bottom:13px;
border-radius:16px;
border:1px solid var(--line);
background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));
font-size:15px;
font-weight:500;
position:relative;
overflow:hidden;
transition:.16s ease;
}

.btn:active{
transform:translateY(1px) scale(.985);
border-color:rgba(231,211,166,.85);
background:rgba(199,165,106,.06);
box-shadow:0 0 16px rgba(199,165,106,.12);
}

.wifi{
margin-top:18px;
padding:20px;
border-radius:18px;
border:1px solid var(--line);
background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));
}

.wtitle{
font-family:'Playfair Display',serif;
font-size:22px;
color:var(--goldSoft);
margin-bottom:12px;
}

.meta{
font-size:12px;
opacity:.56;
letter-spacing:1.3px;
text-transform:uppercase;
margin-top:8px;
}

.value{
font-size:18px;
font-weight:600;
margin-top:4px;
}

.footer{
margin-top:22px;
font-size:12px;
opacity:.5;
letter-spacing:1.6px;
}

@media(max-width:430px){
.title{font-size:28px;}
.text{font-size:14px;min-height:160px;}
.logo{width:86px;height:86px;}
}
</style>
</head>

<body>
<div class="wrap">

<div class="logo">
<img src="Untitled design.png" alt="UzBek Restaurant Bali">
</div>

<h1 class="title">UzBek Restaurant Bali</h1>
<div class="line"></div>

<div class="langs">
<button id="buz" onclick="setLang('uz')">UZ</button>
<button id="bru" onclick="setLang('ru')">RU</button>
<button id="ben" onclick="setLang('en')">EN</button>
<button id="bid
